
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Customer - Bank Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🏦 Bank Management
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/admin-dashboard">Dashboard</a>
            <a href="/customers">Customers</a>
            <a href="/admin-login">Logout</a>
        </div>

    </nav>


    <section class="dashboard">

        <div class="dashboard-header">
            <h1>Edit Customer</h1>
            <p>Update customer information</p>
        </div>


        <form method="POST">

            <label>Full Name</label>
            <input type="text"
                   name="full_name"
                   value="{{ customer[1] }}"
                   required>


            <label>Email</label>
            <input type="email"
                   name="email"
                   value="{{ customer[2] }}"
                   required>


            <label>Phone</label>
            <input type="text"
                   name="phone"
                   value="{{ customer[3] }}">


            <label>Address</label>
            <input type="text"
                   name="address"
                   value="{{ customer[4] }}">


            <button type="submit">
                Update Customer
            </button>

            <a href="/customers">
                Cancel
            </a>

        </form>

    </section>


    <footer>

        <p>
            © 2026 Bank Management System. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
